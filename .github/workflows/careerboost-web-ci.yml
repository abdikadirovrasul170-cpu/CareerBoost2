name: CareerBoost Web CI

on:
  push:
    branches: [ main, "feature/**" ]
    paths:
      - "webapp/**"
      - ".github/workflows/careerboost-web-ci.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "webapp/**"
      - ".github/workflows/careerboost-web-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run tests
        run: mvn -B -f webapp/pom.xml test
      - name: Package application
        run: mvn -B -f webapp/pom.xml package -DskipTests