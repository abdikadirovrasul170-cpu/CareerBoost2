services:
  db:
    image: postgres:16-alpine
    container_name: careerboost-db
    environment:
      POSTGRES_DB: careerboost
      POSTGRES_USER: careerboost
      POSTGRES_PASSWORD: careerboost_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/V1__create_tables.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerboost -d careerboost"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: careerboost-app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
